[package]
name = "indexify"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Make your documents searchable. A local PDF, Markdown and DOCX search terminal."
default-run = "indexify"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
lopdf = "0.46"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
roxmltree = "0.21"
indexly = { version = "0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-width = "0.2"
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true

